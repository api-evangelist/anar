name: Anar
description: 'Anar was a B2B marketplace and business networking mobile app for small businesses,
  sellers, and buyers in India, operating from 2020 to 2023 before shutting down. At its peak it
  reported 1.6M+ registered businesses, 450k+ sellers, 1.1M+ buyers, and 7M+ business enquiries
  processed across 6.6M+ listed products. It raised roughly $6.5M from Accel and Elevation Capital
  plus angel investors. Added to the API Evangelist network as an Accel portfolio company; no public
  developer platform, API, SDK, or documentation was ever published, and the service is now defunct.'
